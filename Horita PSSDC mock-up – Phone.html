  <title>Horita PSSDC on a phone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Horita PSSDC on a phone...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

display: block; font-weight: 800; font-size: 14px; margin-top: 2px\">Ep. 12: How annual leave is earned<\u002Fspan>\n      <span style=\"display: block; font-size: 12px; color: var(--muted)\">9 min · Public Service Rules, chapter on leave<\u002Fspan>\n    <\u002Fspan>\n  <\u002Fbutton>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px\">\n    <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Notices<\u002Fh2>\n    <sc-for list=\"{{homeNotices}}\" as=\"n\" hint-placeholder-count=\"2\">\n      <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px\">\n        <div style=\"font-size: 11px; color: var(--muted); font-weight: 700\">{{n.meta}}<\u002Fdiv>\n        <div style=\"font-weight: 700; font-size: 14px; margin-top: 2px\">{{n.title}}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Your apps<\u002Fh2>\n      <button sc-camel-on-click=\"{{goApps}}\" style=\"border: none; background: transparent; color: var(--accentText); font-weight: 700; font-size: 13px; padding: 8px 0\">All apps<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px\">\n      <sc-for list=\"{{favourites}}\" as=\"a\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{a.open}}\" style=\"border: none; background: transparent; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0\">\n          <span style=\"position: relative; width: 56px; height: 56px; box-sizing: border-box; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: var(--accentText); display: flex; align-items: center; justify-content: center\">\n            <sc-if value=\"{{a.isTrak}}\" hint-placeholder-val=\"{{false}}\"><img src=\"cce7c693-ed37-4a8c-8e9f-34d3d9aaf48c\" alt=\"\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 17px; object-fit: cover; display: block\"><\u002Fsc-if>\n            <sc-if value=\"{{a.isEko}}\" hint-placeholder-val=\"{{false}}\"><img src=\"c9c17bf8-1c18-4d59-9339-9c992b6f9f2f\" alt=\"\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 17px; object-fit: cover; display: block; background: #FFFFFF\"><\u002Fsc-if>\n            <sc-if value=\"{{a.plain}}\" hint-placeholder-val=\"{{true}}\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{a.icon}}\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n            <span style=\"position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 4px; background: {{a.dot}}\"><\u002Fspan>\n            <sc-if value=\"{{a.linked}}\" hint-placeholder-val=\"{{false}}\">\n              <span style=\"position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-radius: 10px; background: var(--linked); color: #FFFFFF; border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center\">\n                <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.arrow}}\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.2\">{{a.name}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APPS -->\n<sc-if value=\"{{is.apps}}\" hint-placeholder-val=\"{{false}} el-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.arrow}}\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.2\">{{a.name}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <sc-if value=\"{{noResults}}\" hint-placeholder-val=\"{{false}}\">\n    <p style=\"margin: 24px 0; text-align: center; color: var(--muted); font-size: 14px\">No app matches “{{query}}”.<\u002Fp>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- SCAN (clock in) -->\n<sc-if value=\"{{is.scan}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center\">\n  <h1 style=\"margin: 0; align-self: flex-start; font-size: 26px; font-weight: 800; letter-spacing: -0.02em\">Clock in<\u002Fh1>\n  <div style=\"align-self: stretch; display: flex; align-items: center; gap: 10px; background: var(--goodSoft); color: var(--good); border-radius: 16px; padding: 12px 14px; text-align: left\">\n    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.pin}}\"><\u002Fpath><\u002Fsvg>\n    <span style=\"flex-grow: 1; font-size: 13px; font-weight: 700\">You are at an approved site · {{site}}<\u002Fspan>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{switchSite}}\" style=\"align-self: flex-start; border: none; background: transparent; color: var(--accentText); font-size: 12px; font-weight: 700; padding: 4px 0\">Try the mock-up at the other site<\u002Fbutton>\n  <sc-if value=\"{{clock.canIn}}\" hint-placeholder-val=\"{{false}}\">\n    <button sc-camel-on-click=\"{{clockIn}}\" style=\"width: 196px; height: 196px; margin-top: 4px; border-radius: 98px; border: none; background: var(--accent); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 18px 40px rgba(8,111,54,0.28)\">\n      <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.scan}}\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase\">{{clock.bigLabel}}<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n  <sc-if value=\"{{clock.onSite}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"align-self: stretch; display: flex; flex-direction: column; gap: 10px; margin-top: 4px\">\n      <div style=\"font-size: 14px; color: var(--muted)\">You are clocked in. Leaving?<\u002Fdiv>\n      <button sc-camel-on-click=\"{{stepOut}}\" style=\"height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.clock}}\"><\u002Fpath><\u002Fsvg>\n        Official outing, back later\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{clockOut}}\" style=\"height: 56px; border-radius: 16px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.logout}}\"><\u002Fpath><\u002Fsvg>\n        Closing for the day\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{clock.hasResult}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"align-self: stretch; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; text-align: left\">\n      <span style=\"width: 36px; height: 36px; border-radius: 18px; background: var(--good); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.check}}\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <div>\n        <div style=\"font-weight: 800\">{{clock.resultTitle}}<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--muted)\">{{clock.resultSub}}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"align-self: stretch; text-align: left; display: flex; flex-direction: column; gap: 8px\">\n    <h2 style=\"margin: 8px 0 0; font-size: 16px; font-weight: 800\">Today<\u002Fh2>\n    <sc-for list=\"{{scans}}\" as=\"s\" hint-placeholder-count=\"1\">\n      <div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px\">\n        <span style=\"font-weight: 800; font-variant-numeric: tabular-nums; width: 46px\">{{s.time}}<\u002Fspan>\n        <span style=\"width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}\"><\u002Fspan>\n        <span style=\"font-size: 14px; flex-grow: 1\">{{s.label}}<\u002Fspan>\n        <span style=\"font-size: 12px; color: var(--muted)\">{{s.site}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5\">The time comes from the server, not the phone. Staff can clock in at any approved PSSDC site.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- INBOX -->\n<sc-if value=\"{{is.inbox}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <h1 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em\">Inbox<\u002Fh1>\n  <div style=\"font-size: 13px; color: var(--muted); line-height: 1.45\">Everything that needs you, from every app, in one list.<\u002Fdiv>\n  <div style=\"display: flex; gap: 8px\">\n    <sc-for list=\"{{inboxTabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.active}}\" style=\"height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-weight: 700; font-size: 13px\">{{t.label}}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-for list=\"{{inbox}}\" as=\"m\" hint-placeholder-count=\"3\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n        <span style=\"font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: {{m.tagBg}}; color: {{m.tagFg}}\">{{m.kind}}<\u002Fspan>\n        <span style=\"font-size: 12px; color: var(--muted)\">{{m.meta}}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-weight: 800; font-size: 15px; line-height: 1.3\">{{m.title}}<\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--muted); line-height: 1.45\">{{m.body}}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{m.act}}\" style=\"align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 12px; border: {{m.btnBorder}}; background: {{m.btnBg}}; color: {{m.btnFg}}; font-weight: 700; font-size: 13px\">{{m.actionLabel}}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ME -->\n<sc-if value=\"{{is.me}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center\">\n    <div style=\"width: 58px; height: 58px; flex-shrink: 0; border-radius: 29px; background: var(--accentSoft); color: var(--accentText); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px\">{{person.initials}}<\u002Fdiv>\n    <div>\n      <div style=\"font-size: 20px; font-weight: 800; letter-spacing: -0.01em\">{{person.name}}<\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--muted)\">{{person.title}} · {{person.unit}}<\u002Fdiv>\n      <div style=\"font-size: 12px; color: var(--muted)\">{{person.gl}} · sample record<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">18<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Annual leave days left<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">19/20<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">On time in September<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">24 Oct<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Appraisal part due<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden\">\n    <sc-for list=\"{{meLinks}}\" as=\"a\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{a.open}}\" style=\"width: 100%; min-height: 54px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); text-align: left; font-size: 15px; font-weight: 600\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accentText)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{a.icon}}\"><\u002Fpath><\u002Fsvg>\n        <span style=\"flex-grow: 1\">{{a.name}}<\u002Fspan>\n        <span style=\"font-size: 12px; color: var(--muted); font-weight: 600\">{{a.note}}<\u002Fspan>\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n    <div style=\"font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em\">Try the mock-up as<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 14px\">\n      <sc-for list=\"{{views}}\" as=\"r\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{r.pick}}\" aria-pressed=\"{{r.active}}\" style=\"height: 48px; border-radius: 11px; border: none; background: {{r.bg}}; color: {{r.fg}}; font-weight: 700; font-size: 12.5px; line-height: 1.15; padding: 0 4px\">{{r.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{toggleDark}}\" aria-pressed=\"{{dark}}\" style=\"height: 48px; display: flex; align-items: center; justify-content: space-between; border: none; background: transparent; color: var(--text); font-size: 15px; font-weight: 600; padding: 0\">\n      <span style=\"display: flex; align-items: center; gap: 10px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--accentText)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{icons.moon}}\"><\u002Fpath><\u002Fsvg>\n        Dark mode\n      <\u002Fspan>\n      <span style=\"width: 46px; height: 28px; border-radius: 14px; background: {{switchBg}}; position: relative; display: block\">\n        <span style=\"position: absolute; top: 3px; left: {{switchKnob}}; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; display: block\"><\u002Fspan>\n      <\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"margin: 0; text-align: center; font-size: 12px; color: var(--muted)\">All names and numbers here are made-up sample data.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: MY PROFILE -->\n<sc-if value=\"{{app.profile}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <div style=\"font-size: 13px; color: var(--muted)\">Your record in Personnel Records. Ask Admin &amp; HR to correct anything wrong.<\u002Fdiv>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden\">\n    <sc-for list=\"{{profileRows}}\" as=\"r\" hint-placeholder-count=\"8\">\n      <div style=\"display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line)\">\n        <span style=\"font-size: 13px; color: var(--muted); font-weight: 600\">{{r.label}}<\u002Fspan>\n        <span style=\"font-size: 14px; font-weight: 700; text-align: right\">{{r.value}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background: var(--accentSoft); color: var(--accentText); border-radius: 16px; padding: 12px 14px; font-size: 13px; font-weight: 600; line-height: 1.45\">Retirement date is worked out from the record: age 60 or 35 years of service, whichever comes first.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: ATTENDANCE -->\n<sc-if value=\"{{app.attendance}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">20<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Days present<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800; color: var(--good)\">19<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">On time<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800; color: var(--warn)\">1<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Late<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{goScan}}\" style=\"height: 50px; border-radius: 14px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 15px\">Clock in or out<\u002Fbutton>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px\">\n    <div style=\"font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em\">Approved sites<\u002Fdiv>\n    <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n      <span style=\"font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--sunk)\">Main office<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: var(--sunk)\">Training annex (sample)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <h2 style=\"margin: 4px 0 0; font-size: 16px; font-weight: 800\">Recent days<\u002Fh2>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden\">\n    <sc-for list=\"{{myDays}}\" as=\"d\" hint-placeholder-count=\"5\">\n      <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line)\">\n        <div style=\"width: 64px\"><div style=\"font-weight: 800; font-size: 14px\">{{d.day}}<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">{{d.date}}<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex-grow: 1; min-width: 0\"><div style=\"font-size: 13px\">{{d.times}}<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">{{d.site}}<\u002Fdiv><\u002Fdiv>\n        <span style=\"font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: {{d.bg}}; color: {{d.fg}}\">{{d.status}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: LEAVE -->\n<sc-if value=\"{{app.leave}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <sc-if value=\"{{lead}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Waiting for your decision<\u002Fh2>\n      <sc-for list=\"{{approvals}}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: baseline\">\n            <span style=\"font-weight: 800; font-size: 15px\">{{p.name}}<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: var(--sunk); color: var(--muted)\">{{p.gl}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px\">{{p.what}}<\u002Fdiv>\n          <div style=\"font-size: 12px; color: var(--muted)\">{{p.step}}<\u002Fdiv>\n          <sc-if value=\"{{p.open}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"display: flex; gap: 8px; margin-top: 4px\">\n              <button sc-camel-on-click=\"{{p.yes}}\" style=\"height: 40px; padding: 0 14px; border-radius: 12px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 13px\">{{p.btn}}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{p.no}}\" style=\"height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); font-weight: 700; font-size: 13px\">Decline<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{p.closed}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"font-size: 13px; font-weight: 700; color: {{p.doneColor}}\">{{p.doneText}}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">18<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Annual left<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">5<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Casual left<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px\"><div style=\"font-size: 21px; font-weight: 800\">{{leave.pending}}<\u002Fdiv><div style=\"font-size: 11px; color: var(--muted); font-weight: 600\">Pending<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Who approves<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px\">\n      <sc-for list=\"{{lineTabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.active}}\" style=\"height: 38px; border-radius: 9px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-weight: 700; font-size: 12.5px\">{{t.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 0\">\n      <sc-for list=\"{{line}}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; gap: 12px; align-items: stretch\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; width: 26px\">\n            <span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800\">{{s.n}}<\u002Fspan>\n            <span style=\"flex-grow: 1; width: 2px; background: {{s.rail}}; min-height: 12px\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding-bottom: 12px\">\n            <div style=\"font-weight: 800; font-size: 14px\">{{s.who}}<\u002Fdiv>\n            <div style=\"font-size: 12px; color: var(--muted)\">{{s.note}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size: 12px; color: var(--muted)\">{{leave.lineNote}}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{leave.showForm}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Request leave<\u002Fh2>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700\">Type\n        <sc-raw-select style=\"height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 15px\">\n          <option>Annual<\u002Foption><option>Casual<\u002Foption><option>Sick<\u002Foption><option>Maternity<\u002Foption><option>Paternity<\u002Foption><option>Study<\u002Foption><option>Examination<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700\">From<input type=\"date\" value=\"2026-10-19\" style=\"height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 10px; font-size: 14px\"><\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700\">To<input type=\"date\" value=\"2026-10-23\" style=\"height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 10px; font-size: 14px\"><\u002Flabel>\n      <\u002Fdiv>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700\">Relief officer while away<input value=\"Bisi Adeyemi\" style=\"height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 14px\"><\u002Flabel>\n      <button sc-camel-on-click=\"{{sendLeave}}\" style=\"height: 50px; border-radius: 14px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 15px\">Send request<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{leave.sent}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"background: var(--goodSoft); color: var(--good); border-radius: 16px; padding: 14px; font-weight: 700; font-size: 14px; line-height: 1.45\">{{leave.sentText}}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: PAYSLIPS -->\n<sc-if value=\"{{app.payslips}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px\">\n    <div style=\"font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em\">How you are paid<\u002Fdiv>\n    <div style=\"font-weight: 800; font-size: 15px\">{{pay.title}}<\u002Fdiv>\n    <div style=\"font-size: 13px; color: var(--muted); line-height: 1.45\">{{pay.sub}}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accentSoft); color: var(--accentText); border-radius: 16px; padding: 10px 10px 10px 14px\">\n    <span style=\"font-size: 13px; font-weight: 700\">Amounts stay hidden until you show them.<\u002Fspan>\n    <button sc-camel-on-click=\"{{togglePay}}\" style=\"height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: var(--card); color: var(--accentText); font-weight: 800; font-size: 13px\">{{payButton}}<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-for list=\"{{payslips}}\" as=\"p\" hint-placeholder-count=\"3\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px\">\n      <div style=\"flex-grow: 1; min-width: 0\">\n        <div style=\"font-weight: 800; font-size: 15px\">{{p.month}}<\u002Fdiv>\n        <div style=\"font-size: 12px; color: var(--muted)\">{{p.what}}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align: right\">\n        <div style=\"font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums\">{{p.amount}}<\u002Fdiv>\n        <div style=\"font-size: 12px; color: var(--accentText); font-weight: 700\">PDF<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: APPRAISAL -->\n<sc-if value=\"{{app.appraisal}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">2026 appraisal<\u002Fh2>\n      <span style=\"font-size: 12px; color: var(--muted); font-weight: 600\">Downline only<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{apprSteps}}\" as=\"s\" hint-placeholder-count=\"5\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <span style=\"width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800\">{{s.n}}<\u002Fspan>\n        <span style=\"font-size: 14px; font-weight: {{s.weight}}; color: {{s.color}}\">{{s.label}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{appr.staffForm}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n      <div><div style=\"font-weight: 800; font-size: 15px\">Your part<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">Items set by your HOD, Chinedu Okeke. Score each from 1 to 5.<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{apprItems}}\" as=\"it\" hint-placeholder-count=\"4\">\n        <label style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600\">\n          <span style=\"flex-grow: 1\">{{it.label}}<\u002Fspan>\n          <sc-raw-select aria-label=\"Your score\" style=\"height: 40px; width: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 8px; font-size: 14px\"><option>4<\u002Foption><option>5<\u002Foption><option>3<\u002Foption><option>2<\u002Foption><option>1<\u002Foption><\u002Fsc-raw-select>\n        <\u002Flabel>\n      <\u002Fsc-for>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700\">Your comments<textarea rows=\"3\" placeholder=\"What went well, and what support you need\" style=\"border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 10px 12px; font-size: 14px; resize: none\"><\u002Ftextarea><\u002Flabel>\n      <button sc-camel-on-click=\"{{sendAppr}}\" style=\"height: 50px; border-radius: 14px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 15px\">Send my part to my HOD<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{appr.staffSent}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"background: var(--goodSoft); color: var(--good); border-radius: 16px; padding: 14px; font-weight: 700; font-size: 14px; line-height: 1.45\">Sent. Your HOD fills their part next. You will see the result here once HR publishes it.<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{appr.hod}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n        <div><div style=\"font-weight: 800; font-size: 15px\">Form items for your team<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">Your staff score themselves on these, then you score them.<\u002Fdiv><\u002Fdiv>\n        <sc-for list=\"{{apprItems}}\" as=\"it\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--sunk); border-radius: 10px; font-size: 14px; font-weight: 600\">{{it.label}}<\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display: flex; gap: 8px\">\n          <input value=\"{{newItem}}\" sc-camel-on-change=\"{{onNewItem}}\" placeholder=\"Add an item\" aria-label=\"Add an item\" style=\"flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 14px\">\n          <button sc-camel-on-click=\"{{addItem}}\" style=\"height: 44px; padding: 0 14px; border-radius: 12px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 14px\">Add<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Your team<\u002Fh2>\n      <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden\">\n        <sc-for list=\"{{team}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line)\">\n            <div style=\"flex-grow: 1; min-width: 0\"><div style=\"font-weight: 700; font-size: 14px\">{{t.name}}<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">{{t.state}}<\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{t.hasAction}}\" hint-placeholder-val=\"{{false}}\">\n              <button sc-camel-on-click=\"{{t.act}}\" style=\"height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 12px\">{{t.action}}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{appr.hr}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n      <div><div style=\"font-weight: 800; font-size: 15px\">Ready to publish<\u002Fdiv><div style=\"font-size: 12px; color: var(--muted)\">HR publishes once supervisors have finished.<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{hrDepts}}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 700\"><span>{{d.name}}<\u002Fspan><span style=\"color: var(--muted)\">{{d.done}}<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden\"><div style=\"height: 6px; width: {{d.pct}}; background: var(--accent)\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{publish}}\" style=\"height: 48px; border-radius: 14px; border: {{appr.pubBorder}}; background: {{appr.pubBg}}; color: {{appr.pubFg}}; font-weight: 700; font-size: 14px\">{{appr.pubLabel}}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Records kept<\u002Fh2>\n  <div style=\"background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden\">\n    <div style=\"display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line)\"><span style=\"font-weight: 700\">2025 appraisal<\u002Fspan><span style=\"font-size: 13px; color: var(--muted)\">Published · 4.2 of 5<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; padding: 12px 14px\"><span style=\"font-weight: 700\">2024 appraisal<\u002Fspan><span style=\"font-size: 13px; color: var(--muted)\">Published · 3.9 of 5<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size: 12px; color: var(--muted); line-height: 1.45\">Later: task records from Trak can be attached as evidence.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- APP: MEMOS AND FILE TRACKING -->\n<sc-if value=\"{{app.memos}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n  <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n    <button sc-camel-on-click=\"{{logLetter}}\" style=\"height: 52px; border-radius: 14px; border: none; background: var(--accent); color: #FFFFFF; font-weight: 700; font-size: 14px\">Log a letter<\u002Fbutton>\n    <button sc-camel-on-click=\"{{logLetter}}\" style=\"height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 700; font-size: 14px\">New memo<\u002Fbutton>\n  <\u002Fdiv>\n  <h2 style=\"margin: 0; font-size: 16px; font-weight: 800\">Files with you<\u002Fh2>\n  <sc-for list=\"{{memos}}\" as=\"m\" hint-placeholder-count=\"3\">\n    <div
